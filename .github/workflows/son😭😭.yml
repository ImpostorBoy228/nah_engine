name: son😭😭

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  nah:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: deps
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential pkg-config \
          libwayland-dev wayland-protocols \
          libxkbcommon-dev libvulkan-dev glslc

    - name: make
      run: time make
