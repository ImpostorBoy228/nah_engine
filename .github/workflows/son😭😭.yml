name: son😭😭

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # no submodules here: luajit.org is dumb http and rejects shallow clones, so
    # citrus depfetch does the full `git submodule update --init` itself
    - uses: actions/checkout@v4

    - name: deps
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential pkg-config \
          libwayland-dev wayland-protocols \
          libxkbcommon-dev libvulkan-dev glslc

    - name: make
      run: time make
